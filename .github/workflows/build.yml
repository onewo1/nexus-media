name: Nexus Media Docker

# 工作流全量触发规则：手动触发 + 推送v开头版本标签自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - v*

# 全局声明运行所需权限，解决默认GITHUB_TOKEN权限不足问题
permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  ci:
    # 复用仓库内已有的CI校验流程
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Release version
        id: release_version
        run: |
          echo "app_version=$(echo $GITHUB_REF_NAME | sed 's/v$.*$/\1/')" >> $GITHUB_ENV

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          # 新增构建缓存配置，大幅缩减跨平台镜像构建耗时
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nexus-media:latest
            ${{ secrets.DOCKER_USERNAME }}/nexus-media:${{ env.app_version }}
            ghcr.io/${{ github.repository_owner }}/nexus-media:latest
            ghcr.io/${{ github.repository_owner }}/nexus-media:${{ env.app_version }}

  release:
    runs-on: ubuntu-latest
    needs: build
    name: Create Release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version and changelog
        id: extract
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT

          CONTENT=$(awk '/^## v'"$VERSION"' /{flag=1;next}/^## v/{flag=0}flag' docs/changelog.md)
          if [ -z "$CONTENT" ]; then
            CONTENT="Nexus Media $GITHUB_REF_NAME 已发布。"
          fi

          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CONTENT"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Nexus Media ${{ steps.extract.outputs.tag }}
          body: ${{ steps.extract.outputs.notes }}
          generate_release_notes: false
          # 开启禁止覆盖重复Release，避免误操作覆盖已发布的正式版本
          overwrite: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Telegram notification
        env:
          NOTES: ${{ steps.extract.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > notes_raw.txt
          # 新增脚本存在性校验，避免脚本丢失导致整个发布流程中断
          if [ ! -f scripts/release_notify.py ]; then
            echo "# Nexus Media ${{ steps.extract.outputs.tag }} 已发布" > notes.txt
          else
            python3 scripts/release_notify.py < notes_raw.txt > notes.txt
          fi
          {
            echo '<b>Nexus Media ${{ steps.extract.outputs.tag }} 已发布</b>'
            echo ''
            cat notes.txt
            echo ''
            echo '📦 Docker: <code>docker pull linyuan0213/nexus-media:${{ steps.extract.outputs.version }}</code>'
            echo '🔗 <a href="https://github.com/${{ github.repository }}/releases/tag/${{ steps.extract.outputs.tag }}">查看 Release</a>'
          } > telegram_msg.txt

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message_file: telegram_msg.txt
          url: https://github.com/${{ github.repository }}

